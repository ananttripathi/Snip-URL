name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir hf-deploy
          cp -r server client Dockerfile package.json hf-deploy/
          cat > hf-deploy/README.md << 'EOF'
---
title: Snip URL Backend
emoji: ✂️
colorFrom: blue
colorTo: purple
sdk: docker
pinned: false
---
EOF
          python - << 'PYEOF'
import os
from huggingface_hub import HfApi

api = HfApi(token=os.environ["HF_TOKEN"])
api.upload_folder(
    folder_path="hf-deploy",
    repo_id="ananttripathiak/snip-url-backend",
    repo_type="space",
)
print("Upload complete!")
PYEOF
