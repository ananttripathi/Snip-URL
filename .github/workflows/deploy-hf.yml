name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir hf-deploy
          cp -r server client Dockerfile package.json hf-deploy/
          cd hf-deploy
          git init
          git config user.email "ananttripathi1996@gmail.com"
          git config user.name "ananttripathiak"
          git add .
          git commit -m "Deploy to HF Spaces"
          git branch -m master main
          git push https://ananttripathiak:$HF_TOKEN@huggingface.co/spaces/ananttripathiak/snip-url-backend main --force
